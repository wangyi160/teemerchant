[package]
name = "teemerchant-attestation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "In-process TEE verification and merchant TLS sessions for teemerchant"

[lib]
name = "teemerchant_attestation"
crate-type = ["cdylib", "rlib"]

[features]
default = ["tdx-verifier", "snp-verifier"]
tdx-verifier = ["dep:dcap-qvl"]
snp-verifier = ["dep:sev", "dep:openssl"]

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
dcap-qvl = { version = "=0.6.5", default-features = false, features = ["std", "ring", "report", "default-x509"], optional = true }
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.18"
zeroize = "1"
sev = { version = "=8.0.0", default-features = false, features = ["snp", "serde", "openssl"], optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util", "io-util"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
